# mallcop.yaml — the one file mallcop reads. Generated by `mallcop init`.
# Run the scan with no flags:  mallcop scan
# Add a source by editing connectors: below.
version: 1
inference:
  mode: donut
  endpoint: https://api.mallcop.app
  key_env: MALLCOP_API_KEY
  model: triage
store:
  path: ./store
  baseline: ""
connectors:
  - kind: file
    id: local-events
    path: ./events.jsonl
    org: ""
    source: ""
    args: []
    since: ""
    env: []
    binary: ""
detectors:
  builtin:
    enabled: true
    disable: []
  sidecars:
    dir: ./detectors/bin
learning:
  dir: detectors
  autonomy: non
  enforce_pin: false
sovereignty:
  tier: open
  contribute_back: false
budgets:
  max_findings: 25
  scan_timeout: 10m
  selfext_spend_cap_usd: 25
