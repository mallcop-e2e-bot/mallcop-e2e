# mallcop.yaml — dogfood: mallcop watches the mallcop-app org.
version: 1
inference:
  mode: donut
  endpoint: https://api.mallcop.app
  key_env: MALLCOP_API_KEY
  model: triage
store:
  path: ./store
  baseline: ""
connectors:
  - kind: github
    id: mallcop-app-org
    path: ""
    org: mallcop-app
    source: ""
    args: []
    since: ""
    env: []
    binary: ""
detectors:
  builtin:
    enabled: true
    disable: []
  sidecars:
    dir: ./detectors/bin
learning:
  dir: detectors
  autonomy: non
  enforce_pin: false
sovereignty:
  tier: open
  contribute_back: false
budgets:
  max_findings: 25
  scan_timeout: 10m
  selfext_spend_cap_usd: 25
